[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-md-tts"
version = "0.1.0"
description = "Convert Markdown documents into polished audio with Qwen-Audio 3.1 TTS Flash."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "qwen-md-tts contributors"}]
dependencies = []

[project.scripts]
qwen-md-tts = "qwen_md_tts:main"

[tool.setuptools]
py-modules = ["qwen_md_tts"]

